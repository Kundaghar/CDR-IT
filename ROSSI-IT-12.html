  <script>
    // ---------- MAC Tools ----------
    let macConvertidas = [];

    function transformarMAC(macRaw) {
      const limpia = macRaw.replace(/-/g, '').trim();
      if (limpia.length !== 12) return "INVALIDA";
      return limpia.match(/.{2}/g).join(":");
    }

    function leerYConvertir(event) {
      const archivo = event.target.files[0];
      if (!archivo) return;

      const lector = new FileReader();
      lector.onload = function(e) {
        const lineas = e.target.result.split(/\r?\n/);
        macConvertidas = [];

        for (const linea of lineas) {
          const match = linea.match(/^([\da-fA-F]{4}-[\da-fA-F]{4}-[\da-fA-F]{4})\s+\d+\s+\w+\s+(GigabitEthernet[\d\/]+)/);
          if (match) {
            const macFormateada = transformarMAC(match[1]);
            macConvertidas.push({
              mac: macFormateada,
              puerto: match[2]
            });
          }
        }

        alert(`✅ Se procesaron ${macConvertidas.length} MACs.`);
      };

      lector.readAsText(archivo);
    }

    function mostrarMAC() {
      const contenedor = document.getElementById("contenido");
      if (macConvertidas.length === 0) {
        contenedor.innerHTML = "<p>❌ No hay MACs cargadas. Subí un archivo primero.</p>";
        return;
      }

      let html = "<h2>MACs Convertidas</h2><table><thead><tr><th>#</th><th>MAC</th><th>Puerto</th></tr></thead><tbody>";
      macConvertidas.forEach((item, i) => {
        html += `<tr><td>${i + 1}</td><td>${item.mac}</td><td>${item.puerto}</td></tr>`;
      });
      html += "</tbody></table>";
      contenedor.innerHTML = html;
    }
let datosFiltrados = [];

    const reader = new FileReader();
    reader.onload = function(e) {
        const text = e.target.result;
        procesarCSV(text);
    };

});
function buscarMACenCSV() {
  if (macConvertidas.length === 0) {
    alert("❌ No hay MACs convertidas. Subí un archivo primero.");
    return;
  }

  if (datosFiltrados.length === 0) {
    alert("❌ No hay archivo CSV cargado. Subí el inventario primero.");
    return;
  }

  const coincidencias = [];

  macConvertidas.forEach(macObj => {
    const macBuscada = macObj.mac.toUpperCase();
    const match = datosFiltrados.find(d => d.mac.trim().toUpperCase() === macBuscada);
    if (match) {
      coincidencias.push({
        mac: macBuscada,
        puerto: macObj.puerto,
        ip: match.ip,
        nombre: match.nombre
      });
    }
  });

  const contenedor = document.getElementById("contenido");
  let html = "<h2>🔍 Coincidencias de MAC en el Inventario</h2>";

  if (coincidencias.length === 0) {
    html += "<p>❌ No se encontraron coincidencias.</p>";
  } else {
    html += "<table><thead><tr><th>#</th><th>MAC</th><th>Puerto</th><th>IP</th><th>Nombre de Equipo</th></tr></thead><tbody>";
    coincidencias.forEach((item, i) => {
      html += `<tr>
        <td>${i + 1}</td>
        <td>${item.mac}</td>
        <td>${item.puerto}</td>
        <td>${item.ip}</td>
        <td>${item.nombre}</td>
      </tr>`;
    });
    html += "</tbody></table>";
  }

  contenedor.innerHTML = html;
}

function procesarCSV(csvText) {
    const lines = csvText.split(/\r?\n/).map(line => line.split(','));

    if (lines.length < 2) {
        alert('El archivo no contiene datos válidos.');
        return;
    }

    const headers = lines[0].map(h => h.trim().replace(/(^")|("$)/g, ''));
    const idxNombre = headers.indexOf("Endpoint name");
    const idxIP = headers.indexOf("IP address");
    const idxMAC = headers.indexOf("MAC address");
    const idxEstadoAV = headers.indexOf("Agent update status");
    const idxUltimoUpdate = headers.indexOf("Sensor last connected");
    const idxSensor = headers.indexOf("Sensor connectivity");

    if (idxNombre === -1 || idxIP === -1 || idxMAC === -1 || idxEstadoAV === -1 || idxUltimoUpdate === -1 || idxSensor === -1) {
        alert('El archivo CSV no contiene las columnas esperadas.');
        return;
    }

    datosFiltrados = [];

    for (let i = 1; i < lines.length; i++) {
        const row = lines[i];
        if (row.length < headers.length) continue;

        datosFiltrados.push({
            nombre: (row[idxNombre] || '').replace(/(^")|("$)/g, ''),
            ip: (row[idxIP] || '').replace(/(^")|("$)/g, ''),
            mac: (row[idxMAC] || '').replace(/(^")|("$)/g, ''),
            estadoAV: (row[idxEstadoAV] || '').replace(/(^")|("$)/g, ''),
            ultimoUpdate: (row[idxUltimoUpdate] || '').replace(/(^")|("$)/g, ''),
            sensor: (row[idxSensor] || '').replace(/(^")|("$)/g, '')
        });
    }

    document.getElementById('controls').style.display = 'block';
    mostrarLista();
}

function mostrarGrafico() {
    ocultarTodo();

    const conectados = datosFiltrados.filter(d => d.sensor.toLowerCase() === 'connected').length;
    const desconectados = datosFiltrados.filter(d => d.sensor.toLowerCase() === 'disconnected').length;
    const sinDato = datosFiltrados.length - conectados - desconectados;

    const ctx = document.getElementById('graficoCircular').getContext('2d');
    if (grafico) grafico.destroy();

    grafico = new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: ['Conectados', 'Desconectados', 'Sin Dato'],
            datasets: [{
                data: [conectados, desconectados, sinDato],
                backgroundColor: ['#28a745', '#ffc107', '#6c757d']
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { position: 'bottom' }
            },
            onClick: (event, elements) => {
                if (elements.length > 0) {
                    const index = elements[0].index;
                    const estado = ['connected', 'disconnected', 'otro'][index];

                    const filtrados = datosFiltrados.filter(d => {
                        if (estado === 'otro') {
                            return d.sensor.toLowerCase() !== 'connected' && d.sensor.toLowerCase() !== 'disconnected';
                        }
                        return d.sensor.toLowerCase() === estado;
                    });

                    mostrarDetalleFiltrado(filtrados, estado);
                }
            }
        }
    });

    document.getElementById('grafico-container').style.display = 'block';
}

}

        if (/^\d+\.\d+\.\d+\.\d+$/.test(ip)) {
            const segmento = ip.split('.').slice(0, 2).join('.') + '.x.x';
            conteoSegmentos[segmento] = (conteoSegmentos[segmento] || 0) + 1;
        }
    });

    const etiquetas = Object.keys(conteoSegmentos);
    const valores = Object.values(conteoSegmentos);
    const colores = etiquetas.map(() => '#' + Math.floor(Math.random()*16777215).toString(16));

    const ctx = document.getElementById('graficoCircular').getContext('2d');
    if (grafico) grafico.destroy();

    grafico = new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: etiquetas,
            datasets: [{
                data: valores,
                backgroundColor: colores
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { position: 'bottom' }
            },
            onClick: (event, elements) => {
                if (elements.length > 0) {
                    const index = elements[0].index;
                    const segmento = etiquetas[index];
                    const baseSegmento = segmento.replace('.x.x', '');

                    const filtrados = datosFiltrados.filter(d =>

let datosDHCP = [];

function leerDHCP(event) {
  const archivo = event.target.files[0];
  if (!archivo) return;

  const lector = new FileReader();
  lector.onload = function(e) {
    const data = new Uint8Array(e.target.result);
    const workbook = XLSX.read(data, { type: 'array' });
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const json = XLSX.utils.sheet_to_json(sheet, { header: 1 });

    datosDHCP = [];

    for (let i = 1; i < json.length; i++) {
      const fila = json[i];
      if (!fila[1] || !fila[2] || !fila[12]) continue;

      datosDHCP.push({
        ip: fila[1].toString().trim(),
        mac: fila[2].toString().trim().toUpperCase(),
        hostname: fila[12].toString().trim()
      });
    }

    alert(`✅ Se cargaron ${datosDHCP.length} registros DHCP.`);
  };

  lector.readAsArrayBuffer(archivo);
}

    return;

    html += `<tr><td>${i + 1}</td><td>${d.ip}</td><td>${d.mac}</td><td>${d.hostname}</td></tr>`;
  });
  html += "</tbody></table>";

  const contenedor = document.getElementById("contenido");
  contenedor.innerHTML = html;
  contenedor.style.display = "block";
  $('#contenido table').DataTable({
    responsive: true,
    scrollX: true,
    pageLength: 50,
    lengthMenu: [ [50, 100, -1], [50, 100, "Todos"] ],
    language: {
      url: "//cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json"
    }
  });
}
function compararDHCPconInventarioAvanzado() {

      return;
    }

      return;
    }

    const dhcpUnicos = {};
    datosDHCP.forEach(d => {
      const mac = d.mac?.trim().toUpperCase();
      if (mac && mac !== "<NONE>" && mac.length >= 10 && !dhcpUnicos[mac]) {
        dhcpUnicos[mac] = d;
      }
    });

    const dhcpFiltrado = Object.values(dhcpUnicos);
    if (dhcpFiltrado.length === 0) {
      alert("⚠️ No se encontraron MACs válidas en el archivo DHCP.");
      return;
    }

    const conAntivirus = [];
    const sinAntivirus = [];
    const otros = [];

    dhcpFiltrado.forEach(dhcp => {
      const mac = dhcp.mac?.trim().toUpperCase();
      if (!mac || mac.length < 10) {
        otros.push(dhcp);
        return;
      }

      const match = datosFiltrados.find(csv =>
        csv.mac.trim().toUpperCase() === mac
      );

      if (match) {
        conAntivirus.push({
          ...dhcp,
          nombreCSV: match.nombre,
          ipCSV: match.ip
        });
      } else {
        sinAntivirus.push(dhcp);
      }
    });

    let html = "<h2>🧪 Comparativa DHCP vs Inventario Antivirus</h2>";

    html += `<h3>🛡️ Equipos con Antivirus (${conAntivirus.length})</h3>`;
    html += generarTablaComparador(conAntivirus, "🛡️");

    html += `<h3>☢️ Equipos sin Antivirus (${sinAntivirus.length})</h3>`;
    html += generarTablaComparador(sinAntivirus, "☢️");

    html += `<h3>❓ Otros registros ignorados (${otros.length})</h3>`;
    html += generarTablaComparador(otros, "❓");

    const contenedor = document.getElementById("contenido");
    contenedor.innerHTML = html;
    contenedor.style.display = "block";

    // Inicializa cada tabla si existe
    $('#contenido table').each(function() {
      $(this).DataTable({
        pageLength: 50,
        lengthMenu: [ [50, 100, -1], [50, 100, "Todos"] ],
        language: {
          url: "//cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json"
        }
      });
    });

  } catch (err) {
    console.error("❌ Error al comparar DHCP con Inventario:", err);
    alert("Ocurrió un error. Revisá la consola para más detalles.");
  }
}
function generarTablaComparador(arr, icono) {
  if (arr.length === 0) return "<p>Sin registros.</p>";

  let html = "<table><thead><tr><th>#</th><th>Icono</th><th>MAC</th><th>IP DHCP</th><th>Hostname</th><th>Nombre CSV</th><th>IP CSV</th></tr></thead><tbody>";
  arr.forEach((item, i) => {
    html += `<tr>
      <td>${i + 1}</td>
      <td>${icono}</td>
      <td>${item.mac || ""}</td>
      <td>${item.ip || ""}</td>
      <td>${item.hostname || ""}</td>
      <td>${item.nombreCSV || "-"}</td>
      <td>${item.ipCSV || "-"}</td>
    </tr>`;
  });
  html += "</tbody></table>";
  return html;
}

function compararMACconInventario() {
  if (!Array.isArray(macConvertidas) || macConvertidas.length === 0) {
    alert("❌ No hay MACs convertidas. Subí un archivo primero.");
    return;
  }

  if (!Array.isArray(datosFiltrados) || datosFiltrados.length === 0) {
    alert("❌ No hay archivo CSV de inventario cargado.");
    return;
  }

  const conAV = [];
  const sinAV = [];
  const invalidas = [];

  macConvertidas.forEach(item => {
    const mac = item.mac?.toUpperCase();

    if (!mac || mac.length < 12) {
      invalidas.push(item);
      return;
    }

    const match = datosFiltrados.find(d =>
      d.mac.trim().toUpperCase() === mac
    );

    if (match) {
      conAV.push({
        ...item,
        nombre: match.nombre,
        ip: match.ip
      });
    } else {
      sinAV.push(item);
    }
  });

  let html = "<h2>🧪 Comparación de MACs contra Inventario Antivirus</h2>";

  html += `<h3>🛡️ Equipos detectados en inventario (${conAV.length})</h3>`;
  html += generarTablaMACDiagnostico(conAV, "🛡️");

  html += `<h3>☢️ MACs sin Antivirus (${sinAV.length})</h3>`;
  html += generarTablaMACDiagnostico(sinAV, "☢️");

  html += `<h3>❓ MACs inválidas o sin datos (${invalidas.length})</h3>`;
  html += generarTablaMACDiagnostico(invalidas, "❓");

  const contenedor = document.getElementById("contenido");
  contenedor.innerHTML = html;
  contenedor.style.display = "block";

  // Activar DataTables en todas las tablas
  $('#contenido table').each(function() {
    $(this).DataTable({
      pageLength: 50,
      lengthMenu: [ [50, 100, -1], [50, 100, "Todos"] ],
      language: {
        url: "https://cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json"
      }
    });
  });
}

function generarTablaMACDiagnostico(arr, icono) {
  if (arr.length === 0) return "<p>Sin registros en esta categoría.</p>";

  let html = "<table><thead><tr><th>#</th><th>Icono</th><th>MAC</th><th>Puerto</th><th>Nombre de Equipo</th><th>IP</th></tr></thead><tbody>";
  arr.forEach((item, i) => {
    html += `<tr>
      <td>${i + 1}</td>
      <td>${icono}</td>
      <td>${item.mac || "-"}</td>
      <td>${item.puerto || "-"}</td>
      <td>${item.nombre || "-"}</td>
      <td>${item.ip || "-"}</td>
    </tr>`;
  });
  html += "</tbody></table>";
  return html;
}
